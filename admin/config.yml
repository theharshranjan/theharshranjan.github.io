backend:
  name: github
  repo: theharshranjan/theharshranjan.github.io   # <-- CHANGE if your repo name is different
  branch: main
  base_url: https://samarpan-cms-auth.YOUR-SUBDOMAIN.workers.dev   # <-- set after deploying the OAuth worker
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "journal-images"
public_folder: "/journal-images"

collections:
  - name: "journal"
    label: "Journal Articles"
    folder: "content/journal"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug (letters, numbers, dashes only)", name: "slug", widget: "string", hint: "e.g. agni-sacred-fire-ayurvedic-health" }
      - { label: "Short Description (used for card + SEO)", name: "description", widget: "text" }
      - label: "Category Badge"
        name: "badge"
        widget: "select"
        options: ["Classical Review", "Research Review", "Narrative Review", "Clinical Insight", "Student Voice", "Case Study", "Editorial", "Systematic Review", "Practitioner Perspective", "Book Review"]
      - label: "Badge Colour (pick any colour for any badge type above)"
        name: "badgeClass"
        widget: "select"
        options:
          - { label: "Green", value: "badge-classical" }
          - { label: "Blue", value: "badge-literature" }
          - { label: "Orange", value: "badge-narrative" }
          - { label: "Purple", value: "badge-clinical" }
          - { label: "Grey", value: "badge-student" }
      - { label: "Cover Image (used on the Journal listing card)", name: "image", widget: "image" }
      - label: "Banner Icon (shown at the top of the article page)"
        name: "bannerIcon"
        widget: "select"
        default: "leaf"
        options: ["leaf", "stethoscope", "brain", "heart-pulse", "activity", "sun", "moon", "flame", "droplet", "flask-conical", "map-pin", "users", "book-open"]
      - { label: "Tags (topics — first one is used for the breadcrumb)", name: "tags", widget: "list" }
      - { label: "Author Name", name: "author", widget: "string", default: "Samarpan Editorial Team" }
      - { label: "Author Photo (optional — shown next to their name)", name: "authorPhoto", widget: "image", required: false }
      - { label: "Author Role", name: "authorRole", widget: "string", default: "Contributing Author" }
      - { label: "Author Bio (shown at the end of the article)", name: "authorBio", widget: "text", default: "Article contributed to The Samarpan Journal." }
      - { label: "Read Time", name: "readTime", widget: "string", default: "5 min read" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Article Body", name: "body", widget: "markdown" }

  - name: "issues"
    label: "Journal Issues"
    folder: "content/issues"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Issue Title", name: "title", widget: "string", hint: "e.g. Exploring PCOS through Ayurveda, Nutrition and Modern Research" }
      - { label: "URL Slug (letters, numbers, dashes only)", name: "slug", widget: "string" }
      - { label: "Volume Label", name: "volume", widget: "string", default: "Volume 1" }
      - { label: "Issue Number Label", name: "issueNumber", widget: "string", default: "Issue 01" }
      - { label: "Cover Title (short — shown on the dark issue cover panel)", name: "coverTitle", widget: "string", hint: "e.g. Integrative Women's Health" }
      - { label: "Short Description (used on the homepage Featured Issue card)", name: "description", widget: "text" }
      - label: "Featured on Homepage?"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Only ONE issue should be marked Featured at a time. If more than one is marked Featured, the most recently published one wins automatically — so you never need to un-feature the old one manually, just publish the new issue as Featured and it takes over."
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Category Tags shown as pills on the card (e.g. Editorial, Research Review, Clinical Insight)"
        name: "categoryTags"
        widget: "list"
        default: ["Editorial"]
      - label: "Article Slugs Included in This Issue (must exactly match each article's URL Slug field, one per line)"
        name: "articleSlugs"
        widget: "list"
        required: false
      - { label: "Issue PDF (optional — click 'Choose an image' to upload a PDF from your computer; leave blank to hide the Download PDF button)", name: "pdfLink", widget: "file", required: false, media_library: { config: { multiple: false } } }
      - { label: "Issue Editorial Note (optional — shown at the top of the issue's own page)", name: "body", widget: "markdown", required: false }
