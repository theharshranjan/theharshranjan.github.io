<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kantakari Community Documentation Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lato:wght@300;400;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDFBF7;--card:#FFFFFF;--ink:#1C1C1C;--mute:#666666;--g:#4A5D4F;--gl:#F1EEE2;--line:#e8e4de;--acc:#C5A059;--clay:#D95D39;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141410;--card:#1F1F1B;--ink:#F0EDE6;--mute:#9A9080;--g:#9db8a4;--gl:#252520;--line:#2E2E28;--acc:#C5A059;--clay:#D95D39;--err:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Lato',system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;line-height:1.15;margin:8px 0 2px;color:var(--g);border-left:5px solid var(--acc);padding-left:10px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;margin:12px 0}
.card h2{font-family:'Marcellus',serif;font-weight:400;font-size:14px;margin:0 0 10px;color:var(--g);border-bottom:2px solid var(--acc);padding-bottom:6px;display:inline-block;text-transform:uppercase;letter-spacing:.03em}
.q{margin:0 0 14px}.q>label,.q>.l{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.h{font-weight:400;color:var(--mute);font-size:13px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-weight:400;cursor:pointer;min-height:44px}
.opts input{width:20px;height:20px;accent-color:var(--g);margin:0}
.use{border:1px dashed var(--line);border-radius:3px;padding:10px;margin-bottom:10px}
.use b{font-size:13px;color:var(--mute)}.use input,.use select{margin-top:6px}
button{font:inherit;font-weight:600;border:0;border-radius:3px;padding:13px 16px;min-height:48px;cursor:pointer}
.pri{background:var(--clay);color:#fff;width:100%;text-transform:uppercase;letter-spacing:.14em;font-size:13px}.sec{background:var(--gl);color:var(--g);width:100%}
.pri:disabled{opacity:.5}
.msg{padding:12px;border-radius:3px;margin:12px 0;font-size:14px;display:none}
.ok{background:var(--gl);color:var(--g)}.bad{background:var(--gl);color:var(--err)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;font-size:13px;color:var(--mute);z-index:2}
</style>
</head>
<body>
<main>
<h1>Community Documentation: Kantakari (<i>Solanum virginianum</i> L.)</h1>
<p class="sub">Interviewer-filled form. JNU, School of Life Sciences. Name and email are stored privately and never published.</p>
<div class="bar" id="bar">Pending uploads: 0</div>
<div class="msg" id="msg"></div>
<form id="f" autocomplete="off" novalidate>
<div class="hp"><label>Website<input type="text" name="website" tabindex="-1"></label></div>
<input type="hidden" id="h_GeoLat"><input type="hidden" id="h_GeoLng"><input type="hidden" id="h_StartTime">
<div id="root"></div>
<div class="card" id="usesCard" data-i="9"><h2>Uses mentioned (Q8-10)</h2>
<p class="h">One block per use. Record the participant's own words.</p>
<div id="uses"></div>
<button type="button" class="sec" id="addUse">+ Add another use</button></div>
<button type="submit" class="pri" id="go">Submit this interview</button>
</form>
</main>
<script>
/* ===== CONFIG: set these two ===== */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbz9ImEOgOJZOWFjxVkfe9xt0CG1yde0kgmRTJ2wzTFtWEhA79PCeYS8_aNuB87-btgv1A/exec';
const TOKEN = 'GL24UuX5c0ryYys2O671KBIO0Hy5'; // must match Code.gs
/* ================================= */
const E='email',T='text',R='radio',M='multi',A='area',D='date';
const S=[
['Interview details',[
[T,'FormNo','Form no. (auto)'],[T,'ParticipantCode','Participant code (auto)'],[T,'Name','Participant name'],[E,'Email','Participant email (optional)'],[D,'InterviewDate','Date'],[T,'Area','Village / area (broad only)'],[T,'Interviewer','Interviewer']]],
['Consent (read aloud first)',[
[R,'ConsentInterview','Consent for interview and written notes',['Given','Refused']],
[R,'ConsentPhoto','Consent for photographs of the plant only',['Given','Not given']],
[R,'ConsentAudio','Consent for audio recording (optional)',['Given','Not given']],
[R,'ConsentContact','Consent to store name and email (private, never published)',['Given','Not given']]],
'The purpose of this academic project is to document traditional knowledge about Kantakari for educational and research purposes. Participation is voluntary and you may stop or skip any question. Your name and email, if you share them, are stored privately for this study only and will not be published or shared.'],
['A. Participant profile',[
[R,'AgeGroup','Age group',['18-30','31-45','46-60','60+']],
[R,'Sex','Sex',['Female','Male','Other / prefer not to say']],
[R,'Occupation','Main occupation',['Farmer','Homemaker','Ayurvedic practitioner','Herbal / folk practitioner','Herb seller','Teacher / student','Other']],
[R,'KnowledgeBasis','Why knowledgeable about plants?',['Family tradition','Practises Ayurveda / herbal medicine','Community elder','Local resident','Other']]]],
['B. Plant identification (show a specimen or photo)',[
[R,'Q1_KnowsPlant','1. Do you know this plant?',['Yes','No','Know it, unsure of name']],
[T,'Q2_LocalName','2. Local name'],[T,'Q3_OtherNames','3. Other names known'],
[A,'Q4_Identify','4. How do you identify it? (leaves, thorns, flower, fruit, smell, habitat)'],
[R,'Q5_Found','5. Where is it commonly found?',['Roadside','Field edge','Wasteland','Forest','Garden','Other']],
[A,'Q6_Distinguish','6. Feature that distinguishes it from similar plants']]],
['C. Traditional use',[
[M,'Q7_PartsUsed','7. Plant part used',['Root','Stem','Leaf','Flower','Fruit','Seed','Whole plant','Other']],
[A,'Q11_Mixed','11. Used alone or mixed? Name the other ingredients'],
[A,'Q12_Groups','12. For children, adults, or both? Any group it is NOT given to?']]],
['D. Knowledge transmission',[
[R,'Q13_LearntFrom','13. Learnt from',['Parent / grandparent','Other relative','Community elder','Practitioner','Book / media','Own experience','Other']],
[R,'Q14_HowLong','14. How long known in family / community',['Under 10 years','10-30 years','Over 30 years',"Don't know"]],
[R,'Q15_OralWritten','15. Oral or written?',['Oral only','Written','Both']],
[R,'Q16_Commonness','16. Commonly known?',['Commonly known','Known by some','Held by few']],
[T,'Q17_OthersWhoKnow','17. Who else knows (role or area only)']]],
['E. Perceived effectiveness and safety (reported views, not proof)',[
[R,'Q18_Useful','18. Considered useful in the community?',['Yes','Sometimes','No',"Don't know"]],
[R,'Q19_Observed','19. Personally observed its use?',['Yes','No']],
[A,'Q20_Precautions','20. Precautions, side effects, who should avoid it'],
[R,'Q21_Traded','21. Sold or traded locally?',['Yes','No',"Don't know"]],
[R,'Q22_DocumentedBefore','22. Has anyone outside documented this before?',['Yes','No',"Don't know"]]]],
['Specimen and interviewer notes',[
[T,'SpecimenCode','Specimen / site code'],
[R,'BotanicalID','Botanical identification',['S. virginianum','S. xanthocarpum','Other / unsure','Not yet done']],
[R,'DescriptionMatch',"Participant's description matches specimen?",['Yes','Partly','No','No specimen']],
[A,'InterviewerNotes','Notes']]]
];
const PARTS=['','Root','Stem','Leaf','Flower','Fruit','Seed','Whole plant','Other'];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let h='';
S.forEach(([title,qs,note],ci)=>{h+=`<div class="card" data-i="${ci}"><h2>${title}</h2>${note?`<p class="h">${esc(note)}</p>`:''}`;
qs.forEach(([t,k,l,o])=>{h+=`<div class="q">`;
if(t==T||t==E)h+=`<label for="${k}">${l}</label><input type="${t==E?'email':'text'}"${t==E?' inputmode="email"':''} id="${k}" name="${k}" maxlength="300">`;
else if(t==D)h+=`<label for="${k}">${l}</label><input type="date" id="${k}" name="${k}">`;
else if(t==A)h+=`<label for="${k}">${l}</label><textarea id="${k}" name="${k}" maxlength="1500"></textarea>`;
else h+=`<div class="l">${l}</div><div class="opts">`+o.map(v=>`<label><input type="${t==R?'radio':'checkbox'}" name="${k}" value="${esc(v)}">${esc(v)}</label>`).join('')+`</div>`;
h+=`</div>`});h+=`</div>`});
$('root').innerHTML=h;
const msg=(t,c)=>{const m=$('msg');m.textContent=t;m.className='msg '+c;m.style.display='block';m.scrollIntoView({block:'center'})};
function useBlock(n){const d=document.createElement('div');d.className='use';
d.innerHTML=`<b>Use ${n}</b><input type="text" placeholder="Condition / use (participant's words)" data-k="cond" maxlength="300"><select data-k="part">${PARTS.map(p=>`<option>${p}</option>`).join('')}</select><input type="text" placeholder="Preparation (juice, decoction, powder, paste...)" data-k="prep" maxlength="300"><input type="text" placeholder="How given / dose / duration" data-k="how" maxlength="300">`;$('uses').appendChild(d)}
useBlock(1);
$('addUse').onclick=()=>{const n=$('uses').children.length+1;if(n<=8)useBlock(n)};
/* queue + draft (guarded: storage can be unavailable) */
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let mem=[];const getQ=()=>ls.get('kq')||mem,setQ=q=>{mem=q;ls.set('kq',q)};
const bar=()=>{const e=$('FormNo');$('bar').textContent='Form '+(e?e.value:'')+'  |  Pending uploads: '+getQ().length};
function collect(){const f={},fd=new FormData($('f'));
S.forEach(([,qs])=>qs.forEach(([t,k])=>{f[k]=t==M?fd.getAll(k):(fd.get(k)||'')}));
const uses=[...document.querySelectorAll('.use')].map(u=>{const o={};u.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value);return o}).filter(u=>u.cond||u.prep||u.how||u.part);
['GeoLat','GeoLng','StartTime'].forEach(k=>f[k]=$('h_'+k).value);f.EndTime=new Date().toISOString();
return{id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)),token:TOKEN,website:fd.get('website')||'',f,uses}}
async function flush(){let q=getQ(),left=[];
for(const it of q){try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(it)});
const j=await r.json();if(!j.ok){if(j.error==='bad token'){msg('Upload rejected: token mismatch. Check TOKEN in this page and Code.gs.','bad')}left.push(it)}}catch(e){left.push(it)}}
setQ(left);bar();return left.length}
$('f').addEventListener('submit',async e=>{e.preventDefault();
const f=$('f'),ci=f.querySelector('[name=ConsentInterview]:checked');
if(!f.FormNo.value.trim()||!f.ParticipantCode.value.trim())return msg('Enter Form no. and Participant code.','bad');
if(!ci||ci.value!=='Given')return msg('Interview consent must be recorded as Given before saving.','bad');
const em=f.Email.value.trim(),cc=f.querySelector('[name=ConsentContact]:checked');
if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return msg('Email address looks invalid.','bad');
if((em||f.Name.value.trim())&&(!cc||cc.value!=='Given'))return msg('Record consent to store name / email as Given, or clear those fields.','bad');
if(/ENDPOINT|PASTE_/.test(ENDPOINT))return msg('ENDPOINT is not set in this page.','bad');
$('go').disabled=true;const rec=collect();ls.set('kcount',(ls.get('kcount')||0)+1);saveSticky();setQ(getQ().concat([rec]));ls.del('draft');
const left=await flush();
newSession(true);
msg(left===0?'Saved to the sheet. A new form is ready.':'No signal or upload failed. The interview is stored on this phone ('+left+' pending) and will retry when online. Do not clear browser data. A new form is ready.',left===0?'ok':'bad');
$('go').disabled=false});
const pad=(n,l)=>String(n).padStart(l,'0'),R4=()=>Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');
const dev=ls.get('kdev')||(()=>{const d=R4().slice(0,2);ls.set('kdev',d);return d})();
const STICKY=['Interviewer','Area','SpecimenCode','BotanicalID'];
const isGrp=e=>e&&e.length&&e[0]&&(e[0].type==='radio'||e[0].type==='checkbox');
function setVal(k,v){const e=$('f').elements[k];if(!e||v==null)return;if(isGrp(e))[...e].forEach(r=>r.checked=[].concat(v).includes(r.value));else e.value=v}
function saveSticky(){const f=$('f'),o={};STICKY.forEach(k=>{const e=f.elements[k];if(!e)return;o[k]=isGrp(e)?((f.querySelector(`[name=${k}]:checked`)||{}).value||''):e.value});ls.set('sticky',o)}
function rules(){const f=$('f'),v=k=>(f.querySelector(`[name=${k}]:checked`)||{}).value;
document.querySelectorAll('[data-i]').forEach(c=>{const i=+c.dataset.i;c.style.display=((v('ConsentInterview')==='Refused'&&i>=2)||(v('Q1_KnowsPlant')==='No'&&((i>=4&&i<=6)||i===9)))?'none':''})}
function newSession(clear){const f=$('f');if(clear){f.reset();$('uses').innerHTML='';useBlock(1);$('h_GeoLat').value=$('h_GeoLng').value='';$('gpst').textContent=''}
const d=new Date(),ymd=String(d.getFullYear()).slice(2)+pad(d.getMonth()+1,2)+pad(d.getDate(),2);
setVal('FormNo','K-'+dev+'-'+pad((ls.get('kcount')||0)+1,3));setVal('ParticipantCode','P'+ymd+R4());
setVal('InterviewDate',d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2));$('h_StartTime').value=d.toISOString();
const s=ls.get('sticky')||{};if(!s.Interviewer)s.Interviewer='Harsh Ranjan';STICKY.forEach(k=>setVal(k,s[k]));rules();bar()}
function snap(){const o={f:{},u:[]};new FormData($('f')).forEach((v,k)=>{if(k!=='website')(o.f[k]=o.f[k]||[]).push(v)});
o.u=[...document.querySelectorAll('.use')].map(u=>[...u.querySelectorAll('[data-k]')].map(i=>i.value));o.t=$('h_StartTime').value;ls.set('draft',o)}
function restore(){const o=ls.get('draft');if(!o)return false;Object.keys(o.f).forEach(k=>setVal(k,isGrp($('f').elements[k])?o.f[k]:o.f[k][0]));
$('uses').innerHTML='';(o.u.length?o.u:[['','','','']]).forEach((r,i)=>{useBlock(i+1);[...$('uses').lastChild.querySelectorAll('[data-k]')].forEach((x,j)=>x.value=r[j]||'')});
if(o.t)$('h_StartTime').value=o.t;rules();bar();return true}
$('f').addEventListener('input',()=>{rules();snap()});$('f').addEventListener('change',()=>{rules();snap()});
$('Area').insertAdjacentHTML('afterend','<button type="button" class="sec" id="gps" style="margin-top:8px">Capture location (optional)</button><div class="h" id="gpst"></div>');
$('gps').onclick=()=>{const t=$('gpst');if(!navigator.geolocation)return t.textContent='Location not available on this device.';t.textContent='Locating...';
navigator.geolocation.getCurrentPosition(p=>{$('h_GeoLat').value=p.coords.latitude.toFixed(3);$('h_GeoLng').value=p.coords.longitude.toFixed(3);t.textContent='Captured, rounded to about 100 m: '+$('h_GeoLat').value+', '+$('h_GeoLng').value},()=>{t.textContent='Could not get location. Type the area instead.'},{timeout:10000})};
addEventListener('online',flush);
if(!restore())newSession(false);
if(getQ().length)flush();
</script>
</body>
</html>
